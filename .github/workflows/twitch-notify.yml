name: Twitch Stream Notify

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitch-stream-notify
  cancel-in-progress: false

jobs:
  check-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Twitch and notify Discord
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python twitch_notify.py

      - name: Save notified stream ID
        run: |
          if [ ! -f last_stream_id.txt ]; then
            echo "保存する配信IDなし"
            exit 0
          fi

          git config user.name "chapy-bot"
          git config user.email "chapy-bot@users.noreply.github.com"

          git add last_stream_id.txt

          if git diff --cached --quiet; then
            echo "配信IDに変更なし"
            exit 0
          fi

          git commit -m "Update notified stream ID"
          git push
